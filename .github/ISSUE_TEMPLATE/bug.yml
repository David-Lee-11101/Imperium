name: Bug report
description: Report reproducible behavior that differs from the documented contract.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, or security exploit details. Use the security policy for sensitive reports.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the smallest reproducible example?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did the documentation or workflow contract lead you to expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, workflow state, configuration shape, and sanitized logs.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant OS, JDK, Node.js, database, broker, and OpenClaw details.
